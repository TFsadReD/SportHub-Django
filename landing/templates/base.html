{% load static %}

<html lang="ru">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="{% static 'flavicon.ico' %}">

    <title>

<body>
{% block content %}{% endblock %}

</body>
</html>
